[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "recursion-reiteration-engine"
version = "0.4.1"
description = "Local, model-neutral recursive refinement with explicit verification boundaries"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
reiterate = "headroom_recursion.cli:main"
recursion-reiteration-engine = "headroom_recursion.cli:main"
recurse = "headroom_recursion.cli:main"

[project.urls]
Repository = "https://github.com/eidolonofficial/recursion-reiteration-engine"

[tool.setuptools.packages.find]
where = ["src"]
